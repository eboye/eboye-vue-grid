# Publishes the packages to npm when a version tag is pushed (`git push github v0.4.0`), with npm
# trusted publishing: npm trusts this workflow through GitHub's OIDC token, so no npm token is
# stored anywhere and provenance is attached automatically. Then creates the GitHub release from
# the CHANGELOG. Each package's trusted publisher on npmjs.com names this file: `release.yml`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: npm 11.5.1 or later (trusted publishing)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) process.exit(1)" "$(npm --version)" \
            || npm install -g npm@latest

      - name: The tag matches every package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in packages/vue-grid packages/vue-grid-mcp packages/cell-renderer-template; do
            actual=$(node -p "require('./$pkg/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::$pkg is $actual, the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The grid first: the MCP server and the renderer template depend on it. Versions already on
      # npm are skipped, so a failed run can simply be re-run. Pre-releases (0.4.0-beta.1) go to `next`.
      - name: Publish to npm
        run: |
          set -o pipefail # npm's exit code survives the filter below
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No GitHub OIDC token available: the job needs 'id-token: write'"
            exit 1
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          for name in @nocopypaste/vue-grid @nocopypaste/vue-grid-mcp @nocopypaste/vue-grid-renderer-template; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              # verbose: npm says why a trusted-publishing (OIDC) login was refused only at this level
              npm publish -w "$name" --access public --tag "$tag" --loglevel verbose 2>&1 \
                | grep -v '^npm verbose \(cli\|title\|argv\|logfile\|cwd\|os\|node\|npm\)\b' \
                || { echo "::error::npm publish failed for $name (look for 'oidc' above)"; exit 1; }
            fi
          done

      - name: npm logs of a failed publish
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ~/.npm/_logs/
          retention-days: 7

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists"
            exit 0
          fi
          # this version's CHANGELOG section, then install lines
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / {f=0} f' packages/vue-grid/CHANGELOG.md > notes.md
          {
            echo
            echo '---'
            echo
            echo '```sh'
            echo "npm i @nocopypaste/vue-grid@$VERSION"
            echo 'npx -y @nocopypaste/vue-grid-mcp   # MCP server for coding agents'
            echo '```'
            echo
            echo 'Claude Code plugin: `/plugin install vue-grid --marketplace https://github.com/eboye/eboye-vue-grid`'
          } >> notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
